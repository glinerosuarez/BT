[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-hunter"
version = "0.1.0"
description = "Automated internship sourcing pipeline"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.72,<1",
    "arize-phoenix-otel>=0.14,<1",
    "langchain>=1,<2",
    "langchain-anthropic>=1,<2",
    "langchain-openai>=1,<2",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "openinference-instrumentation-langchain>=0.1,<1",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "playwright>=1.60,<2",
    "pydantic>=2,<3",
    "reportlab>=4.4,<5",
    "tavily-python>=0.7,<1",
]

[project.optional-dependencies]
local-embeddings = [
    "numpy>=1.26,<3",
    "sentence-transformers>=3,<4",
]

[tool.setuptools]
packages = ["job_hunter", "job_hunter.apply", "job_hunter.apply.adapters", "job_hunter.orchestrator", "job_hunter.sources", "job_hunter.tailoring"]
